name: Build Fraternitas

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Fraternitas/Fraternitas.csproj
      - name: Build
        run: dotnet build Fraternitas/Fraternitas.csproj --configuration Release --no-restore
      - name: Smoke test startup, sign-in and private routes
        shell: bash
        run: |
          set -euo pipefail
          export FRATERNITAS_ADMIN_EMAIL="ci-admin@example.invalid"
          export FRATERNITAS_ADMIN_PASSWORD="ci-only-long-test-password-123"
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/fraternitas-data"
          export ASPNETCORE_URLS="http://127.0.0.1:5088"
          # Admin creation is now explicit. Exercise terminal setup before the login smoke test.
          printf '%s\n%s\n%s\n' "$FRATERNITAS_ADMIN_EMAIL" "$FRATERNITAS_ADMIN_PASSWORD" "$FRATERNITAS_ADMIN_PASSWORD" | dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- admin-setup
          dotnet run --no-build --no-launch-profile -c Release \
            --project Fraternitas/Fraternitas.csproj > "$RUNNER_TEMP/fraternitas.log" 2>&1 &
          pid=$!
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "App log after smoke test failure:"; cat "$RUNNER_TEMP/fraternitas.log"; fi; kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail "http://127.0.0.1:5088/account/login" \
                -c "$RUNNER_TEMP/cookies.txt" -o "$RUNNER_TEMP/login.html"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/fraternitas.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/fraternitas.log"; exit 1; fi
          grep -q "Welcome back" "$RUNNER_TEMP/login.html"
          echo "Login page loaded"
          curl --silent --fail "http://127.0.0.1:5088/account/join?code=sample" \
            -o "$RUNNER_TEMP/join.html"
          grep -q "Join the fraternity" "$RUNNER_TEMP/join.html"
          echo "Join page loaded"

          # An unauthenticated client must not download a group document.
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:5088/resources/file/00000000-0000-0000-0000-000000000000")
          echo "Unauthenticated download response: $status"
          test "$status" = "302" || test "$status" = "401"

          csrf=$(sed -n 's/.*name="__RequestVerificationToken" value="\([^"]*\)".*/\1/p' \
            "$RUNNER_TEMP/login.html" | head -1)
          test -n "$csrf"
          curl --silent -D "$RUNNER_TEMP/headers.txt" -o /dev/null \
            -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" \
            --data-urlencode "__RequestVerificationToken=$csrf" \
            --data-urlencode "email=$FRATERNITAS_ADMIN_EMAIL" \
            --data-urlencode "password=$FRATERNITAS_ADMIN_PASSWORD" \
            "http://127.0.0.1:5088/account/login"
          echo "Login response:"
          grep -i "^HTTP/\|^location:" "$RUNNER_TEMP/headers.txt" || true
          grep -qi "location: /" "$RUNNER_TEMP/headers.txt"
          curl --silent --fail -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/" -o "$RUNNER_TEMP/home.html"
          grep -q "Grow in faith" "$RUNNER_TEMP/home.html"
          echo "Authenticated dashboard loaded"
          for page in calendar readings discussions documents admin; do
            curl --silent --fail -b "$RUNNER_TEMP/cookies.txt" \
              "http://127.0.0.1:5088/$page" -o "$RUNNER_TEMP/$page.html"
            echo "Authenticated page /$page loaded"
          done
