name: Build Fraternitas

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Fraternitas/Fraternitas.csproj
      - name: Build
        run: dotnet build Fraternitas/Fraternitas.csproj --configuration Release --no-restore
