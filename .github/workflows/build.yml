name: Build Fraternitas

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate native smoke-test shell syntax
        run: |
          bash -n .github/scripts/native-actions-test.sh
          bash -n .github/scripts/calendar-permissions-test.sh
      - name: Restore
        run: dotnet restore Fraternitas/Fraternitas.csproj
      - name: Build
        run: dotnet build Fraternitas/Fraternitas.csproj --configuration Release --no-restore
      - name: Verify new password rules and existing password compatibility
        run: |
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/password-policy-test"
          dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- verify-password-policy
      - name: Verify password reset email using mock Resend
        run: dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- verify-password-reset-email
      - name: Verify Douay-Rheims Catholic canon and all five live readings
        run: dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- verify-scripture
      - name: Verify Scripture pin persistence and permissions
        shell: bash
        run: |
          set -euo pipefail
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/scripture-pin-test"
          dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- verify-scripture-pins
      - name: Verify membership role defaults and explicit exceptions
        shell: bash
        run: |
          set -euo pipefail
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/member-access-test"
          dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- verify-member-access
      - name: Verify per-user calendar preference persistence
        shell: bash
        run: |
          set -euo pipefail
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/calendar-preference-test"
          dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- verify-user-preferences
      - name: Smoke test startup, sign-in and private routes
        shell: bash
        run: |
          set -euo pipefail
          export FRATERNITAS_ADMIN_EMAIL="ci-admin@example.invalid"
          export FRATERNITAS_ADMIN_PASSWORD="ci-only-long-test-password-123"
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/fraternitas-data"
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS="http://127.0.0.1:5088"
          # Admin creation is now explicit. Exercise terminal setup before the login smoke test.
          printf '%s\n%s\n%s\n' "$FRATERNITAS_ADMIN_EMAIL" "$FRATERNITAS_ADMIN_PASSWORD" "$FRATERNITAS_ADMIN_PASSWORD" | dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj -- admin-setup
          dotnet run --no-build --no-launch-profile -c Release \
            --project Fraternitas/Fraternitas.csproj > "$RUNNER_TEMP/fraternitas.log" 2>&1 &
          pid=$!
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "App log after smoke test failure:"; cat "$RUNNER_TEMP/fraternitas.log"; fi; kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail "http://127.0.0.1:5088/account/login" \
                -c "$RUNNER_TEMP/cookies.txt" -o "$RUNNER_TEMP/login.html"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/fraternitas.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/fraternitas.log"; exit 1; fi
          grep -q "Welcome back" "$RUNNER_TEMP/login.html"
          echo "Login page loaded"
          curl --silent --fail "http://127.0.0.1:5088/account/join?code=sample" \
            -o "$RUNNER_TEMP/join.html"
          grep -q "Join the fraternity" "$RUNNER_TEMP/join.html"
          echo "Join page loaded"

          # An unauthenticated client must not download a group document.
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:5088/resources/file/00000000-0000-0000-0000-000000000000")
          echo "Unauthenticated download response: $status"
          test "$status" = "302" || test "$status" = "401"

          csrf=$(sed -n 's/.*name="__RequestVerificationToken" value="\([^"]*\)".*/\1/p' \
            "$RUNNER_TEMP/login.html" | head -1)
          test -n "$csrf"
          curl --silent -D "$RUNNER_TEMP/headers.txt" -o /dev/null \
            -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" \
            --data-urlencode "__RequestVerificationToken=$csrf" \
            --data-urlencode "email=$FRATERNITAS_ADMIN_EMAIL" \
            --data-urlencode "password=$FRATERNITAS_ADMIN_PASSWORD" \
            "http://127.0.0.1:5088/account/login"
          echo "Login response:"
          grep -i "^HTTP/\|^location:" "$RUNNER_TEMP/headers.txt" || true
          grep -qi "location: /" "$RUNNER_TEMP/headers.txt"
          curl --silent --fail -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/" -o "$RUNNER_TEMP/home.html"
          grep -q "Grow in faith" "$RUNNER_TEMP/home.html"
          # Home has one simple weekly event list and a full calendar link.
          grep -q "On the calendar" "$RUNNER_TEMP/home.html"
          grep -q "Full calendar" "$RUNNER_TEMP/home.html"
          grep -q "Until 4 PM" "$RUNNER_TEMP/home.html"
          grep -q "Fast until 4:00 PM Eastern" "$RUNNER_TEMP/home.html"
          grep -q "Wednesdays are also meatless" "$RUNNER_TEMP/home.html"
          ! grep -q "Previous week" "$RUNNER_TEMP/home.html"
          ! grep -q "Next week" "$RUNNER_TEMP/home.html"
          ! grep -q "Upcoming gatherings" "$RUNNER_TEMP/home.html"
          # The entire site is static server-rendered. No live Blazor circuit,
          # or Radzen asset, should be needed for buttons or calendar navigation.
          ! grep -q "_content/Radzen.Blazor" "$RUNNER_TEMP/home.html"
          ! grep -q "_framework/blazor.web.js" "$RUNNER_TEMP/home.html"
          curl --silent --show-error --fail "http://127.0.0.1:5088/app.css" \
            -o "$RUNNER_TEMP/app.css"
          test -s "$RUNNER_TEMP/app.css"
          grep -q "frat-calendar-grid" "$RUNNER_TEMP/app.css"
          echo "Static server-rendered site and native calendar styles verified"
          # Regression-check the one-time Advent 2026 seed and Catholic wording.
          python3 - <<'PY'
          import os, sqlite3
          db = sqlite3.connect(os.path.join(os.environ["FRATERNITAS_DATA_DIR"], "fraternitas.db"))
          rows = db.execute("SELECT Category, Title, StartLocal, Description FROM CalendarEvents WHERE GroupId=1").fetchall()
          meetings = [(title, start) for category, title, start, _ in rows if category == "Meeting"]
          fasting = [(title, start) for category, title, start, _ in rows if category == "Fasting"]
          prayers = [(title, start, description) for category, title, start, description in rows if category == "Prayer"]
          assert len(meetings) == 5, f"Expected five gatherings, got {len(meetings)}"
          assert len(fasting) == 9, f"Expected 5 Wednesday + 4 Friday fasts, got {len(fasting)}"
          assert len(prayers) == 32, f"Expected Nov 23-Dec 24 daily practices, got {len(prayers)}"
          assert len(rows) == 46, f"Unexpected total / duplicate seeding: {len(rows)}"
          assert any(start.startswith("2026-11-23 20:00:00") for _, start in meetings), "Next Monday meeting missing"
          assert all("As a daily sacrifice" in description and "Abstaining from television" in description for _, _, description in prayers)
          assert all("asceticism" not in description.lower() and "compliance" not in description.lower() for _, _, description in prayers)
          assert any("meatless" in title.lower() for title, _ in fasting)
          assert all("until 4 PM" in title for title, _ in fasting), "4 PM cutoff missing from seeded fasting titles"
          assert all("Fast until 4:00 PM Eastern" in desc for category, _, _, desc in rows if category == "Fasting"), "4 PM cutoff missing from fasting details"
          print("Advent seed validated: 5 meetings, 9 fasting days, 32 daily prayer/Examen/phone-or-TV practices")
          PY
          echo "Authenticated dashboard loaded"
          for page in calendar readings discussions documents admin; do
            curl --silent --fail -b "$RUNNER_TEMP/cookies.txt" \
              "http://127.0.0.1:5088/$page" -o "$RUNNER_TEMP/$page.html"
            echo "Authenticated page /$page loaded"
          done

          # The checkbox must work without a Blazor circuit: native HTML POST,
          # authenticated cookie, antiforgery token, and persisted SQLite value.
          grep -q '/calendar/preferences/daily-prayer' "$RUNNER_TEMP/calendar.html"
          csrf=$(python3 - "$RUNNER_TEMP/calendar.html" <<'PY'
          import sys
          from html.parser import HTMLParser
          class TokenParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.token = None
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "input" and attributes.get("name") == "__RequestVerificationToken":
                      self.token = attributes.get("value")
          parser = TokenParser()
          with open(sys.argv[1], encoding="utf-8") as source:
              parser.feed(source.read())
          if not parser.token:
              raise SystemExit("Calendar preference form has no antiforgery token")
          print(parser.token)
          PY
          )
          response=$(curl -sS -o /dev/null -w '%{http_code}' \
            -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" \
            --data-urlencode "__RequestVerificationToken=$csrf" \
            --data-urlencode "showDailyPrayer=true" \
            "http://127.0.0.1:5088/calendar/preferences/daily-prayer")
          test "$response" = "302"
          python3 - <<'PY'
          import os, sqlite3
          con = sqlite3.connect(os.path.join(os.environ["FRATERNITAS_DATA_DIR"], "fraternitas.db"))
          count = con.execute("""
              SELECT COUNT(*) FROM AspNetUserClaims
              WHERE ClaimType='fraternitas.preference.calendar.showDailyPrayer'
                AND ClaimValue='true'
          """).fetchone()[0]
          assert count == 1, f"Calendar preference POST did not persist: {count}"
          print("Calendar preference POST persisted for the authenticated account")
          PY
          curl --silent --fail -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar" -o "$RUNNER_TEMP/calendar-saved.html"
          python3 - "$RUNNER_TEMP/calendar-saved.html" <<'PY'
          import sys
          from html.parser import HTMLParser
          class CheckboxParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.checked = False
              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  if tag == "input" and attr.get("name") == "showDailyPrayer":
                      self.checked = "checked" in attr
          parser = CheckboxParser()
          with open(sys.argv[1], encoding="utf-8") as source:
              parser.feed(source.read())
          assert parser.checked, "Saved daily prayer preference not rendered on revisit"
          print("Calendar preference restored from SQLite on page reload")
          PY
          # Native document upload must work without JavaScript or an interactive circuit.
          curl --silent --show-error --fail -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/documents" -o "$RUNNER_TEMP/documents-form.html"
          grep -q 'enctype="multipart/form-data"' "$RUNNER_TEMP/documents-form.html"
          grep -q 'Upload document' "$RUNNER_TEMP/documents-form.html"
          upload_csrf=$(python3 - "$RUNNER_TEMP/documents-form.html" <<'PY'
          import sys
          from html.parser import HTMLParser
          class TokenParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.token = None
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "input" and attributes.get("name") == "__RequestVerificationToken":
                      self.token = attributes.get("value")
          parser = TokenParser()
          with open(sys.argv[1], encoding="utf-8") as source:
              parser.feed(source.read())
          if not parser.token:
              raise SystemExit("Document upload form has no antiforgery token")
          print(parser.token)
          PY
          )
          printf 'An Advent prayer for the fraternity.\n' > "$RUNNER_TEMP/prayer-upload.txt"
          curl --silent --show-error -D "$RUNNER_TEMP/upload-headers" -o /dev/null \
            -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" \
            -F "__RequestVerificationToken=$upload_csrf" \
            -F "eventId=" \
            -F "document=@$RUNNER_TEMP/prayer-upload.txt;filename=Advent-Prayer.txt;type=text/plain" \
            "http://127.0.0.1:5088/documents/upload"
          grep -qE '^HTTP/[^ ]+ 302' "$RUNNER_TEMP/upload-headers"
          grep -qi 'location: /documents?upload=success' "$RUNNER_TEMP/upload-headers"
          python3 - <<'PY'
          import os, sqlite3
          data = os.environ["FRATERNITAS_DATA_DIR"]
          con = sqlite3.connect(os.path.join(data, "fraternitas.db"))
          rows = con.execute("""
              SELECT StoredName, FileName, Length, UploadedById FROM SharedDocuments
              WHERE FileName = 'Advent-Prayer.txt' AND GroupId = 1
          """).fetchall()
          assert len(rows) == 1, f"Expected one uploaded resource, found {len(rows)}"
          stored, name, length, author = rows[0]
          assert author, "Upload must be attributed to a member"
          with open(os.path.join(data, "documents", stored), "rb") as source:
              content = source.read()
          assert length == len(content) and content.startswith(b"An Advent prayer")
          print("Native document upload verified: stored file, SQLite record, member ownership")
          PY
          curl --silent --show-error --fail -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/documents?upload=success" -o "$RUNNER_TEMP/documents-after-upload.html"
          grep -q 'Advent-Prayer.txt' "$RUNNER_TEMP/documents-after-upload.html"
          echo "Uploaded document is visible in the resource library"

          # Calendar creation and event details must work without a Blazor circuit.
          curl --silent --show-error --fail -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar" -o "$RUNNER_TEMP/calendar-native.html"
          grep -q 'href="/calendar?view=' "$RUNNER_TEMP/calendar-native.html"
          grep -q 'class="frat-calendar-slot-overlay"' "$RUNNER_TEMP/calendar-native.html"
          grep -q 'action="/calendar/events/create"' "$RUNNER_TEMP/calendar-native.html"
          create_csrf=$(python3 - "$RUNNER_TEMP/calendar-native.html" <<'PY'
          import sys
          from html.parser import HTMLParser
          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_form = False
                  self.token = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "form":
                      self.in_form = a.get("action") == "/calendar/events/create"
                  elif self.in_form and tag == "input" and a.get("name") == "__RequestVerificationToken":
                      self.token = a.get("value")
              def handle_endtag(self, tag):
                  if tag == "form":
                      self.in_form = False
          parser = FormParser()
          parser.feed(open(sys.argv[1], encoding="utf-8").read())
          if not parser.token:
              raise SystemExit("No protected event creation form")
          print(parser.token)
          PY
          )
          curl -sS -D "$RUNNER_TEMP/create-event-headers" -o /dev/null \
            -b "$RUNNER_TEMP/cookies.txt" \
            --data-urlencode "__RequestVerificationToken=$create_csrf" \
            --data-urlencode "title=Advent calendar event smoke test" \
            --data-urlencode "startLocal=2026-11-23T15:00" \
            --data-urlencode "endLocal=2026-11-23T16:00" \
            --data-urlencode "category=Meeting" \
            --data-urlencode "readingId=" \
            --data-urlencode "description=Smoke-test event details" \
            --data-urlencode "scripture=Luke 1:26-38" \
            "http://127.0.0.1:5088/calendar/events/create"
          grep -qE '^HTTP/[^ ]+ 302' "$RUNNER_TEMP/create-event-headers"
          event_id=$(python3 - "$RUNNER_TEMP/create-event-headers" <<'PY'
          import re, sys, uuid
          headers = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"^location:\s*/calendar(?:\?[^#\r\n]*)?#event-([0-9a-f]{32})", headers, re.I | re.M)
          if not match:
              raise SystemExit("Missing event details hash in redirect")
          print(str(uuid.UUID(hex=match.group(1))))
          PY
          )
          curl -sS -f -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar" -o "$RUNNER_TEMP/calendar-after-create.html"
          event_hex=$(echo "$event_id" | tr -d '-')
          grep -q "id=\"event-$event_hex\"" "$RUNNER_TEMP/calendar-after-create.html"
          # Appointment rendering is date-dependent; the details window itself
          # must be present even when the chosen month is not on screen.
          grep -Fq 'class="@EventCssClass(ev)"' Fraternitas/Components/Pages/Calendar.razor
          # Month/week/day navigation is now plain HTML, not a Blazor event.
          grep -q 'Calendar navigation' "$RUNNER_TEMP/calendar-after-create.html"
          grep -q 'view=month' "$RUNNER_TEMP/calendar-after-create.html"
          grep -q 'view=week' "$RUNNER_TEMP/calendar-after-create.html"
          grep -q 'view=day' "$RUNNER_TEMP/calendar-after-create.html"
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar?view=week&date=2026-11-23" \
            -o "$RUNNER_TEMP/calendar-week.html"
          grep -q 'frat-calendar-week' "$RUNNER_TEMP/calendar-week.html"
          grep -q 'class="frat-calendar-slot-list"' "$RUNNER_TEMP/calendar-week.html"
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar?view=day&date=2026-11-23" \
            -o "$RUNNER_TEMP/calendar-day.html"
          grep -q 'frat-calendar-single-day' "$RUNNER_TEMP/calendar-day.html"
          grep -q 'Advent calendar event smoke test' "$RUNNER_TEMP/calendar-day.html"
          grep -q 'Smoke-test event details' "$RUNNER_TEMP/calendar-after-create.html"
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar?view=month&date=2026-11-23" \
            -o "$RUNNER_TEMP/calendar-month.html"
          python3 - "$event_hex" <<'PY'
          import os, sys
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, parse_qs
          class CalendarParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.base = "/"
                  self.appointments = []
                  self.modal_ids = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "base":
                      self.base = a.get("href", "/")
                  if tag == "a":
                      href = a.get("href", "")
                      self.links.append(href)
                      if "frat-calendar-event" in a.get("class", "").split():
                          self.appointments.append(href)
                  if "calendar-native-modal" in a.get("class", "").split():
                      self.modal_ids.add(a.get("id"))
          for view in ("month", "week", "day"):
              page = CalendarParser()
              with open(os.path.join(os.environ["RUNNER_TEMP"], f"calendar-{view}.html"), encoding="utf-8") as f:
                  page.feed(f.read())
              expected = "event-" + sys.argv[1]
              assert page.appointments, f"No appointments in {view}"
              base = urljoin("http://127.0.0.1:5088/calendar", page.base)
              for href in page.appointments:
                  target = urlparse(urljoin(base, href))
                  assert target.path == "/calendar", f"Appointment navigates away from calendar: {href}"
                  assert parse_qs(target.query).get("view") == [view], href
                  assert parse_qs(target.query).get("date") == ["2026-11-23"], href
                  assert target.fragment in page.modal_ids, f"Missing appointment modal: {href}"
              assert any(urlparse(href).fragment == expected for href in page.appointments), view
              assert all(not href.startswith("#") for href in page.links if href.startswith(("#event-", "#calendar-top", "#edit-event", "#create-event"))), "Bare fragment link would resolve to home"
          print("All month/week/day appointment links resolve to calendar modals with the correct view and date")
          PY
          # Slot selection must open the create dialog with the clicked date/time.
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar?view=day&date=2026-11-23&slot=2026-11-23T13:00" \
            -o "$RUNNER_TEMP/calendar-slotted.html"
          grep -q 'id="create-event"' "$RUNNER_TEMP/calendar-slotted.html"
          grep -q 'name="startLocal"' "$RUNNER_TEMP/calendar-slotted.html"
          grep -q 'value="2026-11-23T13:00"' "$RUNNER_TEMP/calendar-slotted.html"
          grep -q 'value="2026-11-23T14:00"' "$RUNNER_TEMP/calendar-slotted.html"
          grep -q 'class="frat-calendar-day-slots"' "$RUNNER_TEMP/calendar-slotted.html"
          echo "Clicking an hourly slot presets the creation dialog"

          # Event details must offer an Edit button that opens an inline form.
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/calendar?view=day&date=2026-11-23&edit=$event_id" \
            -o "$RUNNER_TEMP/calendar-edit-modal.html"
          grep -q 'id="edit-event"' "$RUNNER_TEMP/calendar-edit-modal.html"
          grep -q 'Save changes' "$RUNNER_TEMP/calendar-edit-modal.html"
          grep -Fq "/calendar/events/$event_id/update" "$RUNNER_TEMP/calendar-edit-modal.html"
          grep -q 'Full details' "$RUNNER_TEMP/calendar-edit-modal.html"
          echo "Event-details modal and inline editor rendered"

          echo "Calendar contains a native event details window and linked appointment"

          curl -sS -f -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/events/$event_id/edit" -o "$RUNNER_TEMP/event-editor.html"
          grep -q "action=\"/calendar/events/$event_id/update\"" "$RUNNER_TEMP/event-editor.html"
          edit_csrf=$(python3 - "$RUNNER_TEMP/calendar-edit-modal.html" <<'PY'
          import sys
          from html.parser import HTMLParser
          class TokenParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.token = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "input" and a.get("name") == "__RequestVerificationToken" and not self.token:
                      self.token = a.get("value")
          parser = TokenParser()
          parser.feed(open(sys.argv[1], encoding="utf-8").read())
          if not parser.token:
              raise SystemExit("Editor missing antiforgery token")
          print(parser.token)
          PY
          )
          today_eastern=$(TZ=America/New_York date +%F)
          curl -sS -D "$RUNNER_TEMP/edit-event-headers" -o /dev/null \
            -b "$RUNNER_TEMP/cookies.txt" \
            --data-urlencode "__RequestVerificationToken=$edit_csrf" \
            --data-urlencode "calendarModal=true" \
            --data-urlencode "calendarView=day" \
            --data-urlencode "calendarDate=2026-11-23" \
            --data-urlencode "title=Updated Advent event smoke test" \
            --data-urlencode "startLocal=${today_eastern}T15:00" \
            --data-urlencode "endLocal=${today_eastern}T16:00" \
            --data-urlencode "category=Meeting" \
            --data-urlencode "description=Updated event details" \
            --data-urlencode "scripture=Luke 1:26-38" \
            "http://127.0.0.1:5088/calendar/events/$event_id/update"
          grep -qE '^HTTP/[^ ]+ 302' "$RUNNER_TEMP/edit-event-headers"
          grep -Fiq "location: /calendar?view=day&date=2026-11-23#event-$event_hex" "$RUNNER_TEMP/edit-event-headers"
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/" -o "$RUNNER_TEMP/home-after-event-update.html"
          grep -q 'Updated Advent event smoke test' "$RUNNER_TEMP/home-after-event-update.html"
          echo "Event edited in the calendar modal appears in the home page summary"
          python3 - "$event_id" <<'PY'
          import os, sqlite3, sys
          con = sqlite3.connect(os.path.join(os.environ["FRATERNITAS_DATA_DIR"], "fraternitas.db"))
          rows = con.execute("SELECT Title, Description FROM CalendarEvents WHERE lower(Id) = lower(?)", (sys.argv[1],)).fetchall()
          assert rows == [("Updated Advent event smoke test", "Updated event details")], rows
          print("Native calendar event update persisted")
          PY
          curl -sS -D "$RUNNER_TEMP/delete-event-headers" -o /dev/null \
            -b "$RUNNER_TEMP/cookies.txt" \
            --data-urlencode "__RequestVerificationToken=$edit_csrf" \
            --data-urlencode "confirmDelete=yes" \
            --data-urlencode "calendarModal=true" \
            --data-urlencode "calendarView=day" \
            --data-urlencode "calendarDate=2026-11-23" \
            "http://127.0.0.1:5088/calendar/events/$event_id/delete"
          grep -qE '^HTTP/[^ ]+ 302' "$RUNNER_TEMP/delete-event-headers"
          grep -Fiq 'location: /calendar?view=day&date=2026-11-23&event=deleted#calendar-top' "$RUNNER_TEMP/delete-event-headers"
          curl -sSf -b "$RUNNER_TEMP/cookies.txt" \
            "http://127.0.0.1:5088/" -o "$RUNNER_TEMP/home-after-event-delete.html"
          if grep -q 'Updated Advent event smoke test' "$RUNNER_TEMP/home-after-event-delete.html"; then
            echo "Deleted event still appears on the home page"
            exit 1
          fi
          python3 - "$event_id" <<'PY'
          import os, sqlite3, sys
          con = sqlite3.connect(os.path.join(os.environ["FRATERNITAS_DATA_DIR"], "fraternitas.db"))
          count = con.execute("SELECT COUNT(*) FROM CalendarEvents WHERE lower(Id) = lower(?)", (sys.argv[1],)).fetchone()[0]
          assert count == 0, "Calendar event delete did not persist"
          print("Native calendar event deletion persisted")
          PY

          # Audit the remaining native form workflows without a WebSocket.
          bash .github/scripts/native-actions-test.sh

      - name: Smoke test first-run web administrator wizard
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_ENVIRONMENT=Development
          export FRATERNITAS_DATA_DIR="$RUNNER_TEMP/wizard-data"
          export ASPNETCORE_URLS="http://127.0.0.1:5089"
          dotnet run --no-build --no-launch-profile -c Release --project Fraternitas/Fraternitas.csproj > "$RUNNER_TEMP/wizard.log" 2>&1 &
          pid=$!
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then tail -100 "$RUNNER_TEMP/wizard.log"; fi; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -sS -f -c "$RUNNER_TEMP/wizard-cookies" "http://127.0.0.1:5089/account/setup" -o "$RUNNER_TEMP/wizard.html"; then break; fi
            sleep 1
          done
          grep -q 'Set up Fraternitas' "$RUNNER_TEMP/wizard.html"
          csrf=$(sed -n 's/.*name="__RequestVerificationToken" value="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/wizard.html" | head -1)
          test -n "$csrf"
          curl -sS -D "$RUNNER_TEMP/wizard-headers" -o /dev/null -b "$RUNNER_TEMP/wizard-cookies" -c "$RUNNER_TEMP/wizard-cookies" \
            --data-urlencode "__RequestVerificationToken=$csrf" --data-urlencode "name=Local Admin" \
            --data-urlencode "email=wizard@example.invalid" --data-urlencode "password=test-password-for-wizard-123" \
            --data-urlencode "confirm=test-password-for-wizard-123" "http://127.0.0.1:5089/account/setup"
          grep -qi 'location: /' "$RUNNER_TEMP/wizard-headers"
          curl -sS -f -b "$RUNNER_TEMP/wizard-cookies" "http://127.0.0.1:5089/admin" -o "$RUNNER_TEMP/wizard-admin.html"
          grep -q 'Manage the group' "$RUNNER_TEMP/wizard-admin.html"
          curl -sS -D "$RUNNER_TEMP/wizard-closed" -o /dev/null "http://127.0.0.1:5089/account/setup"
          grep -qi 'location: /account/login' "$RUNNER_TEMP/wizard-closed"
          echo 'First-run setup and one-time lockout passed'
          # A single invitation must work for multiple distinct users, using the minimum valid password.
          export TEST_INVITE=$(python3 - <<'PY'
          import os, sqlite3, secrets, hashlib, uuid, datetime
          token = secrets.token_urlsafe(32)
          database = os.path.join(os.environ['FRATERNITAS_DATA_DIR'], 'fraternitas.db')
          expires = (datetime.datetime.utcnow() + datetime.timedelta(days=7)).strftime('%Y-%m-%d %H:%M:%S.%f')
          with sqlite3.connect(database) as db:
              db.execute('INSERT INTO Invitations (Id, GroupId, TokenSha256, ExpiresUtc, RedeemedUtc) VALUES (?, 1, ?, ?, NULL)',
                         (str(uuid.uuid4()), hashlib.sha256(token.encode()).hexdigest().upper(), expires))
          print(token)
          PY
          )
          for member in first second; do
            curl -sS --fail -c "$RUNNER_TEMP/$member.cookies" \
              "http://127.0.0.1:5089/account/join?code=$TEST_INVITE" -o "$RUNNER_TEMP/$member.join.html"
            csrf=$(sed -n 's/.*name="__RequestVerificationToken" value="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/$member.join.html" | head -1)
            test -n "$csrf"
            curl -sS -D "$RUNNER_TEMP/$member.join.headers" -o /dev/null \
              -b "$RUNNER_TEMP/$member.cookies" -c "$RUNNER_TEMP/$member.cookies" \
              --data-urlencode "__RequestVerificationToken=$csrf" \
              --data-urlencode "code=$TEST_INVITE" --data-urlencode "name=$member Member" \
              --data-urlencode "email=$member@example.invalid" --data-urlencode "password=abcde1" \
              "http://127.0.0.1:5089/account/join"
            grep -qi 'location: /' "$RUNNER_TEMP/$member.join.headers"
            curl -sS --fail -b "$RUNNER_TEMP/$member.cookies" \
              "http://127.0.0.1:5089/readings" -o "$RUNNER_TEMP/$member.readings.html"
            grep -q 'The Five Joyful Mysteries' "$RUNNER_TEMP/$member.readings.html"
            curl -sS -b "$RUNNER_TEMP/$member.cookies" -D "$RUNNER_TEMP/$member.admin.headers" -o /dev/null "http://127.0.0.1:5089/admin"
            grep -Ei "^HTTP/[^ ]+ (302|403)" "$RUNNER_TEMP/$member.admin.headers"
          done
          python3 - <<'PY'
          import os, sqlite3
          db = sqlite3.connect(os.path.join(os.environ['FRATERNITAS_DATA_DIR'], 'fraternitas.db'))
          users = db.execute('SELECT COUNT(*) FROM AspNetUsers').fetchone()[0]
          active = db.execute('SELECT COUNT(*) FROM Invitations WHERE RedeemedUtc IS NULL').fetchone()[0]
          assert users == 3, f'Expected admin plus 2 members, found {users}'
          assert active == 1, f'Expected shared invite to remain active, found {active}'
          admins = db.execute("SELECT u.Email FROM AspNetUsers u JOIN AspNetUserRoles ur ON u.Id=ur.UserId JOIN AspNetRoles r ON r.Id=ur.RoleId WHERE r.Name='Admin'").fetchall()
          assert admins == [('wizard@example.invalid',)], admins
          PY
          echo 'Multi-use invitation creates two ordinary members, not administrators'
          bash .github/scripts/calendar-permissions-test.sh

          # If a registration fails (for example, an existing email), the
          # original code must survive the retry instead of going blank.
          curl -sS --fail -c "$RUNNER_TEMP/retry.cookies" \
            "http://127.0.0.1:5089/account/join?code=$TEST_INVITE" -o "$RUNNER_TEMP/retry-form.html"
          retry_csrf=$(sed -n 's/.*name="__RequestVerificationToken" value="\([^"]*\)".*/\1/p' \
            "$RUNNER_TEMP/retry-form.html" | head -1)
          test -n "$retry_csrf"
          curl -sS -D "$RUNNER_TEMP/retry.headers" -o /dev/null \
            -b "$RUNNER_TEMP/retry.cookies" -c "$RUNNER_TEMP/retry.cookies" \
            --data-urlencode "__RequestVerificationToken=$retry_csrf" \
            --data-urlencode "code=$TEST_INVITE" --data-urlencode "name=Already Registered" \
            --data-urlencode "email=first@example.invalid" --data-urlencode "password=abcde1" \
            "http://127.0.0.1:5089/account/join"
          retry_url=$(python3 - "$RUNNER_TEMP/retry.headers" "$TEST_INVITE" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          headers = open(sys.argv[1], encoding="utf-8").read().splitlines()
          location = next((line.split(':', 1)[1].strip() for line in headers
                           if line.lower().startswith('location:')), None)
          assert location, "Registration error did not redirect"
          params = parse_qs(urlparse(location).query)
          assert params.get("error") == ["account"], f"Wrong error reason: {location}"
          assert params.get("code") == [sys.argv[2]], "Signup failure discarded the invite code"
          print(location)
          PY
          )
          curl -sS --fail -b "$RUNNER_TEMP/retry.cookies" \
            "http://127.0.0.1:5089$retry_url" -o "$RUNNER_TEMP/retry-page.html"
          grep -Fq "value=\"$TEST_INVITE\"" "$RUNNER_TEMP/retry-page.html"
          grep -q "already registered" "$RUNNER_TEMP/retry-page.html"
          echo 'Signup errors retain the invitation code and explain the retry'

          # Expired/revoked invitations should be identified when the link opens,
          # before a visitor spends time entering their name and password.
          python3 - <<'PY'
          import os, sqlite3, datetime
          path = os.path.join(os.environ["FRATERNITAS_DATA_DIR"], "fraternitas.db")
          with sqlite3.connect(path) as db:
              db.execute("UPDATE Invitations SET RedeemedUtc=? WHERE RedeemedUtc IS NULL",
                         (datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S.%f'),))
          PY
          curl -sS --fail "http://127.0.0.1:5089/account/join?code=$TEST_INVITE" \
            -o "$RUNNER_TEMP/revoked-invite.html"
          grep -q "invitation link is no longer valid" "$RUNNER_TEMP/revoked-invite.html"
          echo 'Revoked invitations are explained on the opening page'
